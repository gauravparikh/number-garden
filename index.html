<title>Number Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: garden strip on top, room tabs, one big play card. Everything is a tap target a 5-year-old can hit. */
:root{
  --bg:#eaf4ee; --card:#ffffff; --fg:#223a32; --muted:#5e7a6e;
  --accent:#ff7a59; --accent-ink:#ffffff; --sun:#ffc83d; --leaf:#4cae7c; --sky:#5aa9e6; --plum:#9b6bd6;
  --line:#cfe3d7; --dot:#2b6cb0; --dot-gone:#d8e7df; --soil:#b98a5b;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15241e; --card:#1f3129; --fg:#eef6f1; --muted:#9fb8ac; --accent:#ff8a6a; --accent-ink:#1a1a1a;
  --sun:#ffd25a; --leaf:#5fc08f; --sky:#7cbcf0; --plum:#b48ae8; --line:#2f463b; --dot:#8dc3ff; --dot-gone:#2a3d34; --soil:#8a6442; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15241e; --card:#1f3129; --fg:#eef6f1; --muted:#9fb8ac; --accent:#ff8a6a; --accent-ink:#1a1a1a;
  --sun:#ffd25a; --leaf:#5fc08f; --sky:#7cbcf0; --plum:#b48ae8; --line:#2f463b; --dot:#8dc3ff; --dot-gone:#2a3d34; --soil:#8a6442; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:700;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;max-width:760px;margin-inline:auto;box-sizing:border-box;-webkit-user-select:none;user-select:none}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:none;padding:0}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:1.45rem;font-weight:700;flex:1 1 auto}
.jar{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px;font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.jar svg{width:20px;height:20px}
.jar.dad{color:var(--muted)}
.gear{background:var(--card);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}

.garden{background:var(--card);border-radius:18px;padding:6px 10px 0;height:84px;overflow:hidden}
.garden svg{width:100%;height:100%;display:block}

.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.room{background:var(--card);border-radius:16px;padding:8px 4px;font-family:var(--display);font-size:.95rem;font-weight:600;border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.room svg{width:30px;height:30px}
.room[aria-selected="true"]{border-color:var(--accent)}
.skills{display:flex;gap:6px;flex-wrap:wrap}
.skill{background:var(--card);border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:600;font-size:.95rem;border:3px solid transparent;display:flex;align-items:center;gap:6px}
.skill[aria-selected="true"]{border-color:var(--leaf)}
.skill small{font-family:var(--body);color:var(--muted);font-size:.75rem}

.card{background:var(--card);border-radius:26px;padding:18px 14px;flex:1 1 auto;display:flex;flex-direction:column;gap:14px;min-height:0;box-sizing:border-box;box-shadow:0 8px 24px rgba(20,60,40,.08)}
.turn{text-align:center;font-family:var(--display);color:var(--plum);font-size:1rem;min-height:1.2em}
.prompt{font-family:var(--display);font-size:1.5rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.stage{display:flex;justify-content:center;align-items:center;flex:1 1 auto;min-height:150px;flex-wrap:wrap;gap:16px}
.msg{min-height:1.8em;text-align:center;font-size:1.1rem;color:var(--muted)}
.msg.good{color:var(--leaf)}

.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad.six{grid-template-columns:repeat(6,1fr)}
.pad.four{grid-template-columns:repeat(4,1fr)}
.num{background:var(--bg);border-radius:16px;height:56px;font-family:var(--display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.num:active{transform:scale(.95)}
.num[disabled]{opacity:.45;cursor:default}
.num.hit{background:var(--sun);color:#1a1a1a}
.num.miss{background:var(--line)}
.num.go{background:var(--accent);color:var(--accent-ink)}
.typed{grid-column:1/-1;text-align:center;font-family:var(--display);font-size:2rem;min-height:1.2em;font-variant-numeric:tabular-nums}

.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:13px 24px;font-family:var(--display);font-size:1.15rem;font-weight:600}
.btn.quiet{background:var(--bg);color:var(--fg)}
.choice{background:var(--bg);border-radius:16px;padding:12px 18px;font-family:var(--display);font-size:1.3rem;font-weight:600;min-width:64px}
.choice.hit{background:var(--sun);color:#1a1a1a}.choice.miss{background:var(--line)}

.dots{display:grid;gap:10px;justify-content:center}
.dot{width:34px;height:34px;border-radius:50%;background:var(--dot)}
.dot.ghost{visibility:hidden}.dot.a{background:var(--leaf)}.dot.b{background:var(--accent)}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;border:3px solid var(--fg);border-radius:10px;padding:5px;background:var(--card)}
.cell{width:46px;height:46px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center}
.cell i{width:32px;height:32px;border-radius:50%;background:var(--dot);display:block;transition:transform .25s,background .25s}
.cell i.new{background:var(--accent)}.cell i.empty{transform:scale(0)}
.frames{display:flex;flex-direction:column;gap:8px;align-items:center}
.plus{font-family:var(--display);font-size:1.6rem}

.ta{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.counts{display:flex;gap:28px;font-family:var(--display);font-size:1rem;color:var(--muted);font-variant-numeric:tabular-nums}
.counts b{color:var(--fg);font-size:1.5rem;display:block;text-align:center}
.rods{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rod{display:grid;grid-template-rows:repeat(5,1fr);grid-auto-flow:column;gap:3px;padding:5px;border-radius:10px;background:var(--bg);border:2px dashed var(--line)}
.rod.solid{border-style:solid;cursor:default}
.rod .u{width:16px;height:16px;border-radius:50%;background:var(--dot)}
.ones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.one{width:32px;height:32px;border-radius:50%;background:var(--dot)}
.one.gone{background:var(--dot-gone)}
.hint{font-size:.95rem;color:var(--muted);text-align:center;max-width:36ch}

.nline{width:100%;max-width:520px}
.eq{font-family:var(--display);font-size:2rem;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.eq .box{width:56px;height:56px;border:3px dashed var(--accent);border-radius:12px;display:grid;place-items:center;color:var(--accent)}

.seq{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.seq .it{width:48px;height:48px;display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.seq .q{border:3px dashed var(--accent);border-radius:12px;color:var(--accent)}
.shape{width:40px;height:40px}
.machine{display:flex;flex-direction:column;gap:6px;align-items:center;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.machine .io{display:grid;grid-template-columns:70px 40px 70px;gap:4px;text-align:center}
.machine .mbox{background:var(--plum);color:#fff;border-radius:14px;padding:6px 18px}

.scale{width:100%;max-width:420px}
.coins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.coin{border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#3a2a10;border:3px solid rgba(0,0,0,.15)}
.tray{min-height:64px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;border:3px dashed var(--line);border-radius:16px;padding:8px;width:100%;max-width:420px;box-sizing:border-box}
.total{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}

.sud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--fg);padding:4px;border-radius:12px}
.sq{width:54px;height:54px;background:var(--card);display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;border-radius:6px}
.sq.given{background:var(--bg);color:var(--muted)}
.sq.sel{outline:4px solid var(--accent);outline-offset:-4px}
.sq.bad{color:var(--accent)}
.sq:nth-child(2),.sq:nth-child(6),.sq:nth-child(10),.sq:nth-child(14){margin-right:4px}
.sq:nth-child(5),.sq:nth-child(6),.sq:nth-child(7),.sq:nth-child(8){margin-bottom:4px}

.wodb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wodb .choice{height:72px;font-size:1.8rem;display:grid;place-items:center}
.clues{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:1.15rem;text-align:center}

.sheet{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet select,.sheet input{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.sheet p{margin:0;color:var(--muted);font-weight:500;line-height:1.45}
.sheet table{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
.sheet td{padding:6px 4px;border-bottom:1px solid var(--line)}
.sheet td:last-child{text-align:right}
.lvl{display:inline-flex;gap:4px}.lvl button{width:30px;height:30px;border-radius:8px;background:var(--bg);font-family:var(--display)}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .4s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){.cell{width:40px;height:40px}.cell i{width:28px;height:28px}.dot{width:30px;height:30px}.num{height:52px;font-size:1.35rem}.room{font-size:.85rem}.sq{width:48px;height:48px}}
</style>

<div class="top">
  <h1>Number Garden</h1>
  <div class="jar" id="jarKid"><svg viewBox="0 0 24 24"><path fill="var(--sun)" d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.3l7.1-.7z"/></svg><span id="kidName">Stars</span> <span id="stars">0</span></div>
  <div class="jar dad" id="jarDad" hidden><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.3l7.1-.7z"/></svg>Dad <span id="dadStars">0</span></div>
  <button class="gear" id="gearBtn" aria-label="grown-up settings"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.4 13a7.4 7.4 0 000-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 00-1.7-1L15 3H9l-.3 2.9a7.6 7.6 0 00-1.7 1l-2.5-1-2 3.5L4.6 11a7.4 7.4 0 000 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 001.7 1L9 21h6l.3-2.9a7.6 7.6 0 001.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg></button>
</div>

<div class="garden"><svg id="gardenSvg" viewBox="0 0 400 70" aria-label="your garden"></svg></div>

<div class="rooms" role="tablist" id="rooms"></div>
<div class="skills" id="skills"></div>

<div class="sheet" id="sheet" hidden>
  <h2 style="font-size:1.2rem">For grown-ups</h2>
  <label>Her name <input id="name" placeholder="optional" maxlength="20"></label>
  <label>Me &amp; Dad mode (take turns) <input type="checkbox" id="duo"></label>
  <p>Levels move by themselves: three problems in a row with no hints goes up a level, two problems that needed hints goes down. Nudge a level here if she's bored or stuck. A star is for finishing, never for being fast.</p>
  <table id="levels"></table>
  <div class="row"><button class="btn quiet" id="resetAll">Start over (clears stars and levels)</button><button class="btn" id="closeSheet">Back to playing</button></div>
</div>

<div class="card" id="card">
  <div class="turn" id="turn"></div>
  <div class="prompt" id="prompt"></div>
  <div class="stage" id="stage"></div>
  <div class="msg" id="msg"></div>
  <div id="controls"></div>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[rnd(0,a.length-1)], shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({stars:0,dad:0,name:'',duo:false,m:{},room:'add',skill:null,turn:0},store.get('ng2',{}));
const save=()=>store.set('ng2',S);

/* ---------- rooms & skills ---------- */
const ROOMS=[
 {id:'warm',title:'Warm-ups',icon:'<circle cx="7" cy="7" r="3" fill="var(--dot)"/><circle cx="17" cy="7" r="3" fill="var(--dot)"/><circle cx="7" cy="17" r="3" fill="var(--dot)"/><circle cx="17" cy="17" r="3" fill="var(--accent)"/>'},
 {id:'add',title:'Add & take',icon:'<rect x="3" y="4" width="6" height="16" rx="2" fill="var(--dot)"/><circle cx="15" cy="8" r="2.4" fill="var(--dot)"/><circle cx="15" cy="16" r="2.4" fill="var(--dot-gone)"/><circle cx="20" cy="8" r="2.4" fill="var(--dot)"/>'},
 {id:'pat',title:'Patterns',icon:'<circle cx="5" cy="12" r="3" fill="var(--accent)"/><rect x="10" y="9" width="6" height="6" fill="var(--leaf)"/><circle cx="21" cy="12" r="3" fill="var(--accent)"/>'},
 {id:'puz',title:'Puzzles',icon:'<path d="M4 18h16M12 18V6M6 6h12" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="6" cy="10" r="3" fill="var(--sun)"/><circle cx="18" cy="10" r="3" fill="var(--plum)"/>'}
];
const SK={};
function skill(def){SK[def.id]=def}
const MAX=id=>SK[id].levels;
const lvl=id=>{const m=S.m[id]||(S.m[id]={lv:1,streak:0,low:0});return m.lv};

/* ---------- shared UI ---------- */
const prompt=$('#prompt'),stage=$('#stage'),msg=$('#msg'),controls=$('#controls'),turnEl=$('#turn');
let ctx=null; // current problem context
function say(t,good){msg.textContent=t;msg.className='msg'+(good?' good':'')}
function cheer(){const c=pick(['Nice thinking!','You got it!','Yes!','That\'s it!','Great counting!','Clever!']);const who=S.duo&&ctx.turn===1?'Dad':S.name;return who?`${c.replace('!','')}, ${who}!`:c}
let ac;function ding(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;[523,659,784].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.15,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.25);o.start(t+i*.09);o.stop(t+i*.09+.3)})}catch(e){}}
function pad(max,onPick,cls){const p=el('div','pad'+(max>9?' six':'')+(cls?' '+cls:''));for(let i=0;i<=max;i++){const b=el('button','num',i);b.onclick=()=>onPick(i,b);p.appendChild(b)}return p}
function lock(p){p.querySelectorAll('button').forEach(b=>b.disabled=true)}
function numpad(onSubmit,digits){digits=digits||2;const nm=el('div','pad');let typed='';const show=el('div','typed','_');nm.appendChild(show);
  for(let i=0;i<10;i++){const k=el('button','num',i);k.onclick=()=>{if(typed.length<digits){typed+=i;show.textContent=typed}};nm.appendChild(k)}
  const clr=el('button','num','⌫');clr.onclick=()=>{typed=typed.slice(0,-1);show.textContent=typed||'_'};
  const ok=el('button','num go','That\'s it');ok.style.gridColumn='span 4';ok.onclick=()=>{if(!typed)return;const ans=+typed;typed='';show.textContent='_';onSubmit(ans,nm)};
  nm.append(clr,ok);return nm}
function choices(opts,onPick){const r=el('div','row');opts.forEach(o=>{const b=el('button','choice');if(typeof o==='string'||typeof o==='number')b.textContent=o;else b.appendChild(o.node);b.onclick=()=>onPick(o,b);r.appendChild(b)});return r}
function nextBtn(){const r=el('div','row');const b=el('button','btn','Next one');b.onclick=()=>play(S.skill);r.appendChild(b);return r}

/* mastery + reward */
function win(text,noMastery){
  if(ctx.done)return;ctx.done=true;say(text,true);
  const m=S.m[S.skill];
  if(!noMastery){if(ctx.hints===0){m.streak++;m.low=0;if(m.streak>=3&&m.lv<MAX(S.skill)){m.lv++;m.streak=0;setTimeout(()=>say(text+' You moved up to level '+m.lv+'!',true),900)}}
    else{m.streak=0;if(ctx.hints>=2){m.low++;if(m.low>=2&&m.lv>1){m.lv--;m.low=0}}else m.low=0}}
  if(S.duo&&ctx.turn===1){S.dad++}else{S.stars++}
  S.turn=1-S.turn;save();renderStars();ding();drawGarden();controls.appendChild(nextBtn());renderSkills();
}
function miss(hint){ctx.hints++;say(hint,false)}
function renderStars(){$('#stars').textContent=S.stars;$('#dadStars').textContent=S.dad;$('#kidName').textContent=S.name||'Stars';$('#jarDad').hidden=!S.duo;const s=$('#jarKid');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')}

/* ---------- garden ---------- */
function drawGarden(){const svg=$('#gardenSvg');const n=Math.min(24,Math.floor(S.stars/2));const part=S.stars%2;let h=`<rect x="0" y="58" width="400" height="12" fill="var(--soil)" rx="4"/>`;
  for(let i=0;i<n;i++){const x=12+i*16,ht=22+((i*7)%14),col=['var(--accent)','var(--sun)','var(--plum)','var(--sky)'][i%4];
    h+=`<line x1="${x}" y1="58" x2="${x}" y2="${58-ht}" stroke="var(--leaf)" stroke-width="2.5"/><ellipse cx="${x-5}" cy="${58-ht/2}" rx="5" ry="2.5" fill="var(--leaf)" transform="rotate(-30 ${x-5} ${58-ht/2})"/>`;
    for(let p=0;p<5;p++){const a=p*72*Math.PI/180;h+=`<circle cx="${x+Math.cos(a)*5}" cy="${58-ht+Math.sin(a)*5}" r="3.6" fill="${col}"/>`}h+=`<circle cx="${x}" cy="${58-ht}" r="2.6" fill="var(--sun)"/>`}
  if(part&&n<24){const x=12+n*16;h+=`<line x1="${x}" y1="58" x2="${x}" y2="48" stroke="var(--leaf)" stroke-width="2.5"/><ellipse cx="${x+4}" cy="50" rx="4" ry="2" fill="var(--leaf)"/>`}
  if(S.stars===0)h+=`<text x="200" y="40" text-anchor="middle" fill="var(--muted)" font-family="var(--display)" font-size="13">Every 2 stars plants a flower</text>`;
  svg.innerHTML=h}

/* ---------- visuals ---------- */
const shapes={circle:c=>`<circle cx="20" cy="20" r="16" fill="${c}"/>`,square:c=>`<rect x="5" y="5" width="30" height="30" rx="4" fill="${c}"/>`,tri:c=>`<path d="M20 4L37 35H3z" fill="${c}"/>`,star:c=>`<path d="M20 3l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="${c}"/>`};
const svgShape=(s,c)=>{const e=el('div');e.innerHTML=`<svg class="shape" viewBox="0 0 40 40">${shapes[s](c)}</svg>`;return e.firstChild};
function tenFrame(k,cls){const f=el('div','frame'+(cls?' '+cls:''));f.cells=[];for(let i=0;i<10;i++){const c=el('div','cell');const d=el('i');if(i>=k)d.className='empty';c.appendChild(d);f.appendChild(c);f.cells.push(d)}return f}

/* ================= WARM-UPS ================= */
skill({id:'dots',room:'warm',title:'How many?',levels:3,mount(lv){
  let n,grid=el('div','dots');

  for(let tries=0;tries<30;tries++){target=rnd(1,max);cands=[...Array(max).keys()].map(i=>i+1);clues=[];
    const pool=shuffle([
      {t:`I am bigger than ${Math.max(1,target-rnd(2,6))}`,f:n=>n>Math.max(1,target-rnd(2,6))},
      {t:`I am smaller than ${Math.min(max,target+rnd(2,6))}`,f:n=>n<Math.min(max,target+rnd(2,6))},
      {t:`I am an ${target%2?'odd':'even'} number`,f:n=>n%2===target%2},
      {t:`My digits add up to ${digsum(target)}`,f:n=>digsum(n)===digsum(target)},
      {t:`I have a ${String(target).slice(-1)} in me`,f:n=>String(n).includes(String(target).slice(-1))},
      {t:`I am ${target%5?'not ':''}a number you say when counting by 5s`,f:n=>(n%5===0)===(target%5===0)}
    ]);
    pool.forEach(c=>{if(cands.length>1&&clues.length<4){const m=c.t.match(/(bigger|smaller) than (\d+)/);const fn=m?(m[1]==='bigger'?n=>n>+m[2]:n=>n<+m[2]):c.f;const next=cands.filter(fn);if(next.includes(target)&&next.length<cands.length){cands=next;clues.push(c.t)}}});
    if(cands.length===1)break}
  if(cands.length!==1){target=cands[0]}
  prompt.textContent='I am thinking of a number…';const ul=el('ul','clues');clues.forEach(c=>ul.appendChild(el('li','',c)));stage.appendChild(ul);
  controls.appendChild(numpad((v,nm)=>{if(v===target){lock(nm);win(`${cheer()} Only ${target} fits all the clues.`)}else{const broken=clues.find((c,i)=>{const m=c.match(/(bigger|smaller) than (\d+)/);if(m)return m[1]==='bigger'?!(v>+m[2]):!(v<+m[2]);if(c.includes('odd'))return v%2===0;if(c.includes('even'))return v%2!==0;if(c.startsWith('My digits'))return digsum(v)!==digsum(target);if(c.startsWith('I have a'))return !String(v).includes(String(target).slice(-1));if(c.includes('counting by 5s'))return (v%5===0)!==(target%5===0);return false});
    miss(broken?`${v} breaks this clue: "${broken}".`:'Check each clue against your number.')}},3))}});

/* ---------- play loop ---------- */
function play(id){S.skill=id;save();prompt.textContent='';stage.innerHTML='';controls.innerHTML='';say('');
  ctx={hints:0,done:false,turn:S.duo?S.turn:0};
  turnEl.textContent=S.duo?(ctx.turn===1?"Dad's turn":`${S.name||'Your'} turn`):'';
  const m=S.m[id]||(S.m[id]={lv:1,streak:0,low:0});SK[id].mount(m.lv);renderSkills()}
function renderRooms(){const r=$('#rooms');r.innerHTML='';ROOMS.forEach(rm=>{const b=el('button','room',`<svg viewBox="0 0 24 24">${rm.icon}</svg>${rm.title}`);b.setAttribute('role','tab');b.setAttribute('aria-selected',S.room===rm.id);b.onclick=()=>{S.room=rm.id;const first=Object.values(SK).find(s=>s.room===rm.id).id;renderRooms();play(first)};r.appendChild(b)})}
function renderSkills(){const s=$('#skills');s.innerHTML='';Object.values(SK).filter(k=>k.room===S.room).forEach(k=>{const b=el('button','skill',`${k.title}<small>${k.levels>1?'lv '+lvl(k.id):''}</small>`);b.setAttribute('aria-selected',S.skill===k.id);b.onclick=()=>play(k.id);s.appendChild(b)})}
function renderLevels(){const t=$('#levels');t.innerHTML='';Object.values(SK).forEach(k=>{const tr=el('tr');tr.innerHTML=`<td>${ROOMS.find(r=>r.id===k.room).title} · ${k.title}</td>`;const td=el('td');const box=el('div','lvl');const dn=el('button','','−'),sp=el('span','',` ${lvl(k.id)} / ${k.levels} `),up=el('button','','+');
  dn.onclick=()=>{const m=S.m[k.id];if(m.lv>1){m.lv--;m.streak=0;m.low=0;save();renderLevels()}};up.onclick=()=>{const m=S.m[k.id];if(m.lv<k.levels){m.lv++;m.streak=0;m.low=0;save();renderLevels()}};box.append(dn,sp,up);td.appendChild(box);tr.appendChild(td);t.appendChild(tr)})}

/* ---------- wiring ---------- */
$('#gearBtn').onclick=()=>{const open=$('#sheet').hidden;$('#sheet').hidden=!open;$('#card').hidden=open;if(open)renderLevels()};
$('#closeSheet').onclick=()=>{$('#sheet').hidden=true;$('#card').hidden=false;renderSkills();play(S.skill)};
$('#name').value=S.name;$('#name').oninput=e=>{S.name=e.target.value.trim();save();renderStars()};
$('#duo').checked=S.duo;$('#duo').onchange=e=>{S.duo=e.target.checked;save();renderStars()};
$('#resetAll').onclick=()=>{S.stars=0;S.dad=0;S.m={};S.turn=0;save();renderStars();drawGarden();renderLevels()};
renderStars();drawGarden();renderRooms();
if(!S.skill||!SK[S.skill]||SK[S.skill].room!==S.room)S.skill=Object.values(SK).find(s=>s.room===S.room).id;
play(S.skill);
})();
</script>
